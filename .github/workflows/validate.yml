name: Validate Deployment Studio

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned, checksum-verified)
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --no-banner .

  validate-structure:
    runs-on: ubuntu-latest
    name: Validate Repository Structure
    needs: secret-scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required directories exist
        run: |
          echo "Checking required directories..."
          dirs=("helm/cloudforge-platform" "helm/individual-charts" "kubernetes" "scripts" "docs")
          for dir in "${dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "::error::Required directory missing: $dir"
              exit 1
            fi
            echo "✅ Found: $dir"
          done

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          files=("README.md" "VERSION" "helm/cloudforge-platform/Chart.yaml" "helm/cloudforge-platform/values.yaml")
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

  validate-helm:
    runs-on: ubuntu-latest
    name: Validate Helm Charts
    needs: validate-structure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.0

      - name: Lint Umbrella Chart
        run: |
          echo "Linting cloudforge-platform umbrella chart..."
          helm lint helm/cloudforge-platform

      - name: Lint Individual Charts
        run: |
          echo "Linting individual charts..."
          charts=("identity" "ingest" "knowledge" "nova" "security")
          for chart in "${charts[@]}"; do
            echo "Linting $chart..."
            helm lint helm/individual-charts/$chart
          done

      - name: Template Check
        run: |
          echo "Running helm template check..."
          helm template test helm/cloudforge-platform --namespace cloudforge-platform

  validate-kubernetes:
    runs-on: ubuntu-latest
    name: Validate Kubernetes Manifests
    needs: validate-structure
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Namespace Manifests
        run: |
          echo "Validating namespace manifests..."
          for file in kubernetes/namespaces/*.yaml; do
            [ -f "$file" ] || continue
            echo "Checking $file..."
            if ! grep -q "kind: Namespace" "$file"; then
              echo "::error::$file is missing 'kind: Namespace'"
              exit 1
            fi
          done

      - name: Validate RBAC Manifests
        run: |
          echo "Validating RBAC manifests..."
          for file in kubernetes/rbac/*.yaml; do
            [ -f "$file" ] || continue
            echo "Checking $file..."
            if ! grep -q "kind:" "$file"; then
              echo "::error::$file is missing 'kind:' field"
              exit 1
            fi
          done
