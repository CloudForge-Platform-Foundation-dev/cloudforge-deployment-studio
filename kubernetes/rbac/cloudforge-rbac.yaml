apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudforge-sa
  namespace: cloudforge-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: cloudforge-platform
  name: cloudforge-role
rules:
- apiGroups: ["", "apps", "extensions"]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudforge-rolebinding
  namespace: cloudforge-platform
subjects:
- kind: ServiceAccount
  name: cloudforge-sa
  namespace: cloudforge-platform
roleRef:
  kind: Role
  name: cloudforge-role
  apiGroup: rbac.authorization.k8s.io
