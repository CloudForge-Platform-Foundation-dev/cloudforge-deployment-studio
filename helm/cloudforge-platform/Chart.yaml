apiVersion: v2
name: cloudforge-platform
description: Umbrella Helm chart for CloudForge Platform Architecture
type: application
version: 1.0.0
appVersion: "1.0.0"
dependencies:
  - name: identity
    version: 1.0.0
    repository: "file://../individual-charts/identity"
    condition: identity.enabled
  - name: ingest
    version: 1.0.0
    repository: "file://../individual-charts/ingest"
    condition: ingest.enabled
  - name: knowledge
    version: 1.0.0
    repository: "file://../individual-charts/knowledge"
    condition: knowledge.enabled
  - name: nova
    version: 1.0.0
    repository: "file://../individual-charts/nova"
    condition: nova.enabled
  - name: security
    version: 1.0.0
    repository: "file://../individual-charts/security"
    condition: security.enabled
